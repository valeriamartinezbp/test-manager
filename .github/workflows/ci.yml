name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # postinstall ejecuta `prisma generate`; ningún paso necesita MySQL
      - run: npm ci
      - run: npm run db:validate
      - run: npm run lint
      - run: npm run check:focus
      - run: npm run typecheck
      - run: npm test
      - run: npm run format:check
      - run: npm run build
